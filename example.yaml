esphome:
  name: oil-tank-monitor
  friendly_name: Oil Tank Monitor

esp32:
  board: esp32dev

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Oil-Tank-Monitor"
    password: !secret ap_password

captive_portal:

# Load the Magnus HAWKi component
external_components:
  - source: github://denislooby/esphome-magnus-hawki
    components: [magnus_hawki]

# BLE tracker and client
esp32_ble_tracker:

ble_client:
  - mac_address: "XX:XX:XX:XX:XX:XX"  # Replace with your Magnus HAWKi MAC
    id: hawki_ble

# Magnus HAWKi hub
# Connects every 4 hours to read cached data, then disconnects.
# Use the "measure" button in HA to trigger a fresh radar measurement.
magnus_hawki:
  ble_client_id: hawki_ble
  tank_height: 320       # mm - from your device config (characteristic 1991)
  update_interval: 14400s # How often to read cached data (default: 4 hours)

# Sensors
sensor:
  - platform: magnus_hawki
    distance:
      name: "Oil Tank Distance"
    level:
      name: "Oil Tank Level"

text_sensor:
  - platform: magnus_hawki
    timestamp:
      name: "Oil Tank Last Reading"

# Button to trigger a fresh radar measurement on demand
button:
  - platform: magnus_hawki
    measure:
      name: "Oil Tank Measure Now"
